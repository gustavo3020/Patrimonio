name: Testes

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore tests/Financas/Patrimonio.Financas.Tests/Patrimonio.Financas.Tests.csproj

      - name: Executar testes
        run: dotnet test tests/Financas/Patrimonio.Financas.Tests/Patrimonio.Financas.Tests.csproj --no-restore